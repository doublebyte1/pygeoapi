# Runs script to detect the likelihood of a PR have being create
# by an agent, or with a human with heavy use of AI. 
#
# This workflow, enables us to access the secret CODEBERG_TOKEN,
# without compromising security.

name: Detect AI

on:
  workflow_run:
    workflows: ["Collect PR metadata"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyse:
    name: Classify PR (AI vs human)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}

    steps:
      # Download the metadata stored in the previous workflow
      - name: Download PR metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-metadata
          path: ./artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('./artifacts/pr-metadata.json') as f:
              data = json.load(f)
          print(data)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"PR_NUMBER={data['pr_number']}\n")
              env.write(f"PR_URL={data['html_url']}\n")
          PY

      # The Codeberg repo is private, so we have to clone it with a Codeberg token
      - name: Check out repository
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CODEBERG_TOKEN" ] || { echo "::error::CODEBERG_TOKEN secret is required"; exit 1; }
          git clone --quiet "https://user:${CODEBERG_TOKEN}@codeberg.org/geoamish/uncover-agent.git" "$RUNNER_TEMP/uncover-agent"
          shopt -s dotglob
          mv "$RUNNER_TEMP/uncover-agent"/* .
          rmdir "$RUNNER_TEMP/uncover-agent"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # we can upgrade this later

      - name: Run uncover_agents.py
        run: |
          set -euo pipefail
          python uncover_agents.py "$PR_URL" | tee result.json

      # These labels must exist in the repository
      - name: Apply AI / human label
        run: |
          set -euo pipefail
          LABEL=$(python3 -c "import json;print(json.load(open('result.json')).get('label',''))")
          echo "Classifier label: $LABEL"
          case "$LABEL" in
            Low)
              gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-label "Human generated" ;;
            High|Very\ High)
              gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-label "AI generated" ;;
            *)
              echo "Label '$LABEL' maps to no auto-label; nothing to do." ;;
          esac
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}